# The menu of the message of a commit: F11 in the window of the message, the git plugin of
# coole.  A group for each item, its name the key of the item; the items in this order.
#
#   label   = what the menu shows (an action has one of its own)
#   action  = signoff, coauthor, fixes, restore, diff, check, generate, prompt, menu
#   command = run by sh in the work tree instead: the message on its stdin, and
#             COOLE_GIT_MODE (commit, amend, reword) and COOLE_GIT_COMMIT in its
#             environment
#   output  = what is done with what the command prints: trailer (each line a trailer
#             at the end), replace (the message, the trailers kept), insert (at the
#             cursor), show (in a window of the viewer), none
#   modes   = commit;amend;reword: the messages it is in the menu for, all without it
#
# [x]
# label = Reviewed-by: a reviewer
# command = echo 'Reviewed-by: A Reviewer <a@example.org>'
# output = trailer

[s]
action = signoff

[c]
label = Co-authored-by: an author of the history...
action = coauthor

[f]
label = Fixes: the commit it fixes...
action = fixes

[r]
label = Restore the message the commit has
action = restore
modes = amend;reword

[d]
action = diff

[l]
label = Check the shape of the message
action = check

[g]
label = Generate the message with AI
action = generate

[p]
label = Edit the prompt of the AI...
action = prompt

[m]
label = Edit this menu...
action = menu
