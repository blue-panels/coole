# What the tree of the project marks a file or a symbol as; the marks and their colors are in
# the section [project] of the skin, by the same names.
#
#   names       whole names of files: Makefile
#   extensions  what follows the last dot, in any case: c for calc.c and CALC.C
#   stems       names before the last dot: README for README.ru
#   kinds       the kinds the plugin ctags gives a symbol: func, struct
#
# A file is looked for by its name, then by its extension, then by its stem; a file in none of
# them is a script when it starts with #!, else a plain file; a symbol in none is a variable.
# ~/.config/coole/project-marks.ini adds groups and keys; a key there replaces the same key
# here whole: names=run in its [build] leaves Makefile out.

[source]
    extensions=c;cc;cpp;cxx;c++;m;mm;py;go;rs;lua;js;mjs;ts;tsx;jsx;java;kt;rb;pl;pm;php;cs;swift;scala;hs;ml;zig;el;vim;sql;tcl;awk;d;nim;dart

[header]
    extensions=h;hh;hpp;hxx;h++

[build]
    names=meson.build;meson_options.txt;meson.options;Makefile;makefile;GNUmakefile;CMakeLists.txt;configure.ac;Makefile.am;Makefile.in;Cargo.toml;go.mod;package.json;setup.py;pyproject.toml;Dockerfile
    extensions=mk;cmake;mak

[doc]
    names=README;LICENSE;COPYING;NEWS;ChangeLog;AUTHORS;INSTALL;TODO;HACKING
    extensions=md;txt;rst;adoc;org;tex;pod;1;2;3;4;5;6;7;8;9
    stems=README;LICENSE;COPYING;NEWS;ChangeLog;AUTHORS;INSTALL;TODO;HACKING

[config]
    extensions=ini;json;toml;yaml;yml;xml;conf;cfg;keymap;syntax;desktop

[script]
    extensions=sh;bash;zsh;fish;ksh

[function]
    kinds=func

[prototype]
    kinds=proto

[type]
    kinds=struct;union;class;typedef

[enum]
    kinds=enum

[macro]
    kinds=macro
