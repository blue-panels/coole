# The defaults of a project by its language: how coole builds it and debugs it when the
# project says nothing of its own.  A group for each language.  ~/.config/coole/presets.ini
# has groups of its own: they come first, and a group of it replaces that of coole of its
# name.  What the user sets for a project, in Debug configuration or .coole/debug.ini, stays.
#
# The language of a project is that of the first group with a marker in its root; else that
# of the file in front, by its ending.
#
#   markers    = files in the root of a project of the language
#   extensions = the endings of its files
#   build      = the command that builds a project, run in its root, when the project has no
#                meson, cmake or Makefile; its errors "file:line:col: error: text" are listed
#   gdb        = the gdbs that debug its programs: the first there in PATH
#   program    = the program to debug before it is built, from the root; ${package} is the
#                name of the package of Cargo.toml
#   hide       = the programs not to choose from, patterns of names from the root
#   adapter    = the debug adapter that runs its scripts
#   address    = host:port the adapter listens on, 0 for a port of its own
#   launch     = what the request launch of the adapter needs, a JSON object
#
# Lists have ';' between the items.

[rust]
markers = Cargo.toml
extensions = .rs
build = cargo build --message-format=short
gdb = rust-gdb;gdb
program = target/debug/${package}
# the copies cargo keeps for itself
hide = target/*/deps/*;target/*/build/*;target/*/incremental/*

[c]
extensions = .c;.h;.cc;.cpp;.cxx;.hh;.hpp;.hxx
gdb = gdb

[python]
extensions = .py
# with the Python of the virtual environment of the project, when it has debugpy
adapter = python3 -m debugpy.adapter

[bash]
extensions = .sh;.bash
# bash-dap runs the script in the terminal of the program by itself
adapter = bash-dap

[go]
markers = go.mod
extensions = .go
adapter = dlv dap --listen=127.0.0.1:0
address = 127.0.0.1:0
launch = {"mode": "debug"}

[javascript]
extensions = .js;.mjs;.ts
adapter = js-debug-adapter 0
address = 127.0.0.1:0
launch = {"type": "pwa-node"}
