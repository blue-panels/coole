# What coole asks the AI, for the git plugin: F11 > g in the message of a commit.  The
# command that writes the message is the user's, in [commit-message] of ~/.config/coole/ai.ini:
# run by sh in the work tree, the prompt and the diff on its stdin, the message on its stdout.
# A project may give its own prompts and input in .coole/ai.ini; both go before these.
#
#   prompt          = what the command is asked first
#   prompt-commit   = the same for a new commit, before prompt
#   prompt-amend    = for an amend
#   prompt-reword   = for another message of a commit of the log
#   input           = diff, the diff after the prompt; none, the prompt alone

[commit-message]
# command = claude -p --tools "" --no-session-persistence
prompt = Write the git commit message for the changes below. The first line is a subject of at most 50 characters, "scope: what it does" when the history uses scopes; then an empty line and a body wrapped at 72 columns that says why. Print the message alone: no markdown, no code fences, no trailers.
prompt-reword = Below is a commit of a git repository: its message as it is now, and its changes. Write a better message for it, true to the changes: a subject of at most 50 characters, "scope: what it does" when the history uses scopes; then an empty line and a body wrapped at 72 columns that says what was wrong before and what the change does. Keep what the message says right. Print the message alone: no markdown, no code fences, no trailers.
input = diff
