# Kanagawa theme for coole
# Based on the Kanagawa color scheme: https://github.com/rebelot/kanagawa.nvim
# A color scheme inspired by the famous painting "The Great Wave off Kanagawa"

[skin]
    description = Kanagawa - Inspired by "The Great Wave off Kanagawa"
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = color188;color235
    gauge = color188;color237
    input = black;color66
    inputunchanged = color249;color66
    inputmark = color66;black
    disabled = color245;color248
    reverse = black;color188
    hintbar = default;default
    shellprompt = default;default
    commandline = default;default
    inputhistory =
    shadow = color245;black
    frame = color188;color235

[dialog]
    _default_ = black;color248
    dfocus = black;color66
    dhotnormal = color167;color248
    dhotfocus = color167;color66
    dselnormal = black;color66
    dselfocus = color178;color66
    dtitle = color167;color248
    dframe = black;color248

[error]
    _default_ = color188;color167
    errdfocus = color235;color248
    errdhotnormal = color222;color167
    errdhotfocus = color222;color248
    errdtitle = color222;color167
    errdframe = color188;color167

[menu]
    _default_ = color188;color24
    menusel = color188;color235
    menuhot = color222;color24
    menuhotsel = color222;color235
    menuinactive = color235;color24
    menuframe = color188;color24

[popupmenu]
    _default_ = color188;color24
    menusel = color222;color235
    menutitle = color222;color24
    menuframe = color188;color24

[buttonbar]
    hotkey = color188;color235
    button = color235;color66

[statusbar]
    _default_ = color235;color66

[help]
    _default_ = color235;color248
    helpitalic = color167;color248
    helpbold = color24;color248
    helplink = color235;color66
    helpslink = color222;color24
    helptitle = color24;color248
    helpframe = color235;color248

[editor]
    _default_ = color188;color235
    editbold = color222;color108
    editmarked = color235;color66
    editwhitespace = color24;color235
    editnonprintable = ;color235
    editlinestate = color188;color66
    bookmark = color188;color167
    bookmarkfound = color235;color108
    editrightmargin = color24;color235
    editframeactive = color188;
    editframedrag = color108;

[mcterm]
    _default_ = color188;color235
    mctermselected = black;color188

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    breakpoint-char = ●
    breakpoint-pending-char = ◊
    breakpoint-disabled-char = ○
    breakpoint-condition-char = ◉
    exec-char = >
    exec-breakpoint-char = ♦
    tree-closed-char = >
    tree-open-char = ▼

[git-graph]
    commit = ●
    merge = ○
    ahead = ↑
    behind = ↓

[syntax]
    # the colors of the kinds of text the highlighting names (see the [syntax]
    # section of skins/README.txt); what is not named keeps the colors of mcedit
    comment = color242
    keyword.other.todo = color235;color179
    string = color107
    constant = color168
    constant.language = color215
    constant.character.escape = color215
    constant.other.placeholder = color215
    keyword = color140
    keyword.operator = color179
    storage = color140
    storage.type = color108
    support = color110
    support.type = color108
    support.type.property.name = color179
    entity.name = color110
    entity.name.tag = color110
    entity.name.section = color110
    entity.other.attribute.name = color179
    variable = color187
    variable.language = color215
    punctuation = color146
    meta.preprocessor = color203
    markup.heading = color110;;bold
    markup.bold = color187;;bold
    markup.italic = color187;;italic
    markup.underline.link = color110;;underline
    markup.list = color140
    markup.raw = color107
    markup.quote = color242;;italic
    markup.inserted = color107
    markup.deleted = color203
    markup.changed = color179
    meta.diff.header = color140;;bold
    meta.diff.range = color110
    invalid = color187;color167
