[skin]
    256colors = true
    description = Dark Far skin

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    spinner_sequence = ⠉⠒⠤⣀⣉⣒⣤⣭⣶⣿⣶⣤⣀
    _default_ = lightgray;black
    gauge = white;black
    input = black;cyan
    inputunchanged = gray;cyan
    inputmark = cyan;black
    disabled = gray;blue
    reverse = black;lightgray
    inputhistory =
    shadow = gray;black
    frame = lightgray;black

[dialog]
    _default_ = brightcyan;blue
    dfocus = blue;cyan
    dhotnormal = white;
    dhotfocus = white;cyan
    dselnormal = blue;cyan
    dselfocus = white;cyan
    dtitle = white;
    dframe = brightcyan;blue

[error]
    _default_ = white;red
    errdfocus = black;lightgray
    errdhotnormal = yellow;red
    errdhotfocus = yellow;lightgray
    errdtitle = yellow;red
    errdframe = white;red

[menu]
    _default_ = lightgray;blue
    menusel = black;cyan
    menuhot = white;blue
    menuhotsel = white;cyan
    menuinactive = black;lightgray
    menuframe = lightgray;blue

[popupmenu]
    _default_ = lightgray;blue
    menusel = black;cyan
    menutitle = lightgray;blue
    menuframe = lightgray;blue

[buttonbar]
    hotkey = red;lightgray
    button = black;lightgray

[statusbar]
    _default_ = black;lightgray

[help]
    _default_ = black;lightgray
    helpitalic = red;lightgray
    helpbold = blue;lightgray
    helplink = black;cyan
    helpslink = yellow;blue
    helptitle = blue;lightgray
    helpframe = black;lightgray

[editor]
    _default_ = lightgray;black
    editbold = yellow;green
    editmarked = black;lightgray
    treeselected = black;cyan
    editwhitespace = brightblue;black
    editnonprintable = brightblue;black
    editlinestate = white;cyan
    bookmark = white;red
    bookmarkfound = black;green
    editrightmargin = white;blue
#    editbg =
    editframe = gray;
    editframeactive = lightgray;
    editframedrag = white;

[mcterm]
    _default_ = lightgray;black
    mctermselected = black;lightgray

[widget-editor]
    window-state-char = ↕
    window-close-char = ×
    fold-open-char = ▾
    fold-close-char = ▸
    breakpoint-char = ●
    breakpoint-pending-char = ◊
    breakpoint-disabled-char = ○
    breakpoint-condition-char = ◉
    exec-char = >
    exec-breakpoint-char = ♦
    tree-closed-char = >
    tree-open-char = ▼
    build-error-char = ×
    query-error-char = ×

[git-graph]
    commit = ●
    merge = ○
    rail = (
    ahead = ↑
    behind = ↓

[query]
    schema-char = ◫
    database-char = ◫
    table-char = ▦
    partitioned-char = ▤
    view-char = ◰
    matview-char = ◲
    foreign-char = ⇄
    sequence-char = #
    function-char = ƒ
    procedure-char = ƒ
    aggregate-char = Σ
    column-char = ·
    key-char = ⚿
    fkey-char = →
    index-char = ↯
    reference-char = ←
    trigger-char = ⚡
    collection-char = ▦
    timeseries-char = ◷
    field-char = ·
    validator-char = ✓
    pipeline-char = ⇶
# the colors of the marks, by what they are; the names of the items; what is at the right
    schema = white
    database = white
    item = gray
    table = cyan
    partitioned = cyan
    collection = cyan
    timeseries = cyan
    view = green
    matview = green
    foreign = magenta
    sequence = yellow
    function = brightblue
    procedure = brightblue
    aggregate = brightblue
    key = yellow
    fkey = cyan
    reference = cyan
    index = magenta
    trigger = brightred
    info = gray

[project]
# the marks of the tree of the project, by what a file or a symbol is
    file-char = ·
    source-char = %e
    header-char = %e
    build-char = ⌘
    doc-char = ≡
    config-char = ⛭
    script-char = $
    binary-char = ⊘
    function-char = ƒ
    prototype-char = ƒ
    type-char = 𝓒
    enum-char = ⑿
    macro-char = #
    variable-char = ⦿
# their colors
    file = gray
    source = brightgreen
    header = green
    build = yellow
    doc = white
    config = cyan
    script = magenta
    binary = gray
    function = brightblue
    prototype = blue
    type = cyan
    enum = cyan
    macro = yellow
    variable = gray

[debugger]
    added = brightblue
    added-cursor = blue
