# The Four Seasons skins demonstrate how to use direct RGB true colors.

[skin]
    # The sun is shining and the grass is green,
    # Under the three feet of snow I mean.
    description = Four Seasons – Winter
    truecolors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[aliases]
    Main = #e4e3ed
    MainFg = #000
    MarkedFg = #3064a9
    HeaderFg = MarkedFg
    Selected = #cbd1e1
    Dialog = Selected
    DialogFocus = #afbad8
    Input = Main
    PaleFg = #777
    ShadowFg = #000
    ShadowBg = #727176
    Error = #3c4766
    ErrorFocus = #586896
    Top = #6b99d7
    MenuActive = Bottom
    MenuSelected = Top
    Bottom = #a7c2e7
    BottomNumber = #8e93a5
    BottomNumberFg = #e4e3ed
    Help = Selected
    HelpBoldFg = ErrorFocus
    HelpItalicFg = Error
    HelpLinkFg = #4c84cd
    EditorLineNumber = #f1f0f6
    EditorWhitespace = EditorLineNumber
    EditorRightMargin = EditorLineNumber
    EditorBookmark = Bottom
    EditorFindAll = Top
    EditorVoid = BottomNumber
    EditorFrameFg = MainFg
    EditorFrameActiveFg = MarkedFg
    EditorFrameDragFg = #fff
    ViewerBoldFg = HelpBoldFg
    ViewerUnderlinedFg = HelpLinkFg
    ViewerSelected = EditorBookmark
    DiffAdd = #80e080
    DiffChangedLine = Selected
    DiffGap = #e08080
    StructDimFg = PaleFg
    TreeKeyFg = #005f87
    TreeValueFg = #00af00
    StructJumpFg = #4c84cd
    StructRemarkFg = #00af00
    StructChangedFg = #5f00af
    StructBlock = Top
    StructDimFg = PaleFg
    TreeKeyFg = #005f87
    TreeValueFg = #00af00
    StructJumpFg = #4c84cd
    StructRemarkFg = #00af00
    StructChangedFg = #5f00af
    StructBlock = Top

[core]
    _default_ = MainFg;Main
    gauge = ;DialogFocus
    input = #000;Input
    inputunchanged = PaleFg;Input
    inputmark = #000;DialogFocus
    disabled = PaleFg;Dialog
    reverse = #000;Bottom
    shadow = ShadowFg;ShadowBg
    frame = MainFg;Main
    spinner_sequence = ╭╭──╮╮││╯╯──╰╰││

[dialog]
    _default_ = #000;Dialog
    dfocus = ;DialogFocus
    dhotnormal = ;;underline
    dhotfocus = ;DialogFocus;underline
    dselnormal = ;DialogFocus
    dselfocus = ;DialogFocus
    dtitle = ;;bold
    dframe = #000;Dialog

[error]
    _default_ = #fff;Error
    errdfocus = ;ErrorFocus
    errdhotnormal = ;;underline
    errdhotfocus = ;ErrorFocus;underline
    errdtitle = ;;bold
    errdframe = #fff;Error

[menu]
    _default_ = #000;MenuActive
    menusel = ;MenuSelected
    menuhot = ;;underline
    menuhotsel = ;MenuSelected;underline
    menuinactive = ;Top
    menuframe = #000;MenuActive

[popupmenu]
    _default_ = #000;Dialog
    menusel = ;DialogFocus
    menutitle = ;;bold
    menuframe = #000;Dialog

[buttonbar]
    hotkey = BottomNumberFg;BottomNumber
    button = #000;Bottom

[statusbar]
    _default_ = #000;Top

[help]
    _default_ = #000;Help
    helpbold = HelpBoldFg;;bold
    helpitalic = HelpItalicFg;;italic
    helplink = HelpLinkFg;;underline
    helpslink = Help;HelpLinkFg
    helpframe = #000;Help

[editor]
    _default_ = MainFg;Main
    editbold = MarkedFg;;bold
    editmarked = ;Selected
    editwhitespace = ;EditorWhitespace
    editnonprintable = #000;Bottom
    editlinestate = #000;EditorLineNumber
    bookmark = #000;EditorBookmark
    bookmarkfound = #000;EditorFindAll
    editrightmargin = ;EditorRightMargin
    editbg = ;EditorVoid
    editframe = EditorFrameFg
    editframeactive = EditorFrameActiveFg
    editframedrag = EditorFrameDragFg

[mcterm]
    _default_ = MainFg;Main
    mctermselected = MainFg;Selected

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    fold-open-char = ▾
    fold-close-char = ▸
