# Rose Pine theme for coole
# Based on the Rose Pine color scheme: https://rosepinetheme.com/
# A soho vibes color scheme with warm colors

[skin]
    description = Rose Pine - Soho vibes with warm colors
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = color188;color235
    gauge = color188;color237
    input = black;color139
    inputunchanged = lightgray;color139
    inputmark = color139;black
    disabled = color245;color248
    reverse = black;color188
    hintbar = default;default
    shellprompt = default;default
    commandline = default;default
    inputhistory =
    shadow = color245;black
    frame = color188;color235
    spinner_sequence = ▲▲◀◀▼▼▶▶

[dialog]
    _default_ = black;color248
    dfocus = black;color139
    dhotnormal = color203;color248
    dhotfocus = color203;color139
    dselnormal = black;color139
    dselfocus = red;color139
    dtitle = color203;color248
    dframe = black;color248

[error]
    _default_ = color188;color203
    errdfocus = color235;color248
    errdhotnormal = color222;color203
    errdhotfocus = color222;color248
    errdtitle = color222;color203
    errdframe = color188;color203

[menu]
    _default_ = color188;color96
    menusel = color188;color235
    menuhot = color222;color96
    menuhotsel = color222;color235
    menuinactive = color235;color96
    menuframe = color188;color96

[popupmenu]
    _default_ = color188;color96
    menusel = color222;color235
    menutitle = color222;color96
    menuframe = color188;color96

[buttonbar]
    hotkey = color188;color235
    button = color235;color139

[statusbar]
    _default_ = color235;color139

[help]
    _default_ = color235;color248
    helpitalic = color203;color248;italic
    helpbold = color96;color248;bold
    helplink = color199
    helpslink = color222;color96
    helptitle = color96;color248
    helpframe = color235;color248

[editor]
    _default_ = color188;color235
    editbold = brightmagenta;color183
    editmarked = color235;color139
    editwhitespace = color96;color235
    editnonprintable = ;color235
    editlinestate = color188;color139
    bookmark = color188;color203
    bookmarkfound = color235;color183
    editrightmargin = color96;color235
    editframeactive = color188;
    editframedrag = color183;

[mcterm]
    _default_ = color188;color235
    mctermselected = black;color188

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[git-graph]
    commit = ●
    merge = ○
    ahead = ↑
    behind = ↓

[syntax]
    # the colors of the kinds of text the highlighting names (see the [syntax]
    # section of skins/README.txt); what is not named keeps the colors of mcedit
    comment = color60
    keyword.other.todo = color235;color222
    string = color222
    constant = color222
    constant.language = color181
    constant.character.escape = color204
    constant.other.placeholder = color204
    keyword = color31
    keyword.operator = color103
    storage = color31
    storage.type = color152
    support = color181
    support.type = color152
    support.type.property.name = color183
    entity.name = color181
    entity.name.tag = color152
    entity.name.section = color183
    entity.other.attribute.name = color183
    variable = color189
    variable.language = color181
    punctuation = color103
    meta.preprocessor = color183
    markup.heading = color183;;bold
    markup.bold = color189;;bold
    markup.italic = color189;;italic
    markup.underline.link = color181;;underline
    markup.list = color31
    markup.raw = color222
    markup.quote = color60;;italic
    markup.inserted = color152
    markup.deleted = color204
    markup.changed = color222
    meta.diff.header = color31;;bold
    meta.diff.range = color181
    invalid = color189;color204
