# Nord theme for coole
# Based on the Nord color scheme: https://www.nordtheme.com/
# An arctic, north-bluish color palette

[skin]
    description = Nord - Arctic, north-bluish color palette
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = color188;color236
    gauge = color188;color240
    input = color236;color109
    inputunchanged = color245;color109
    inputmark = color109;color236
    disabled = color245;color252
    reverse = color236;color188
    hintbar = default;default
    shellprompt = default;default
    commandline = default;default
    inputhistory =
    shadow = color245;color16
    frame = color188;color236
    spinner_sequence = ⠈⠐⠠⢀⡀⠄⠂⠁⠉⠘⠰⢠⣀⡄⠆⠃⠋⠙⠸⢰⣠⣄⡆⠇⠏⠛⠹⢸⣰⣤⣆⡇⡏⠟⠻⢹⣸⣴⣦⣇⣏⡟⠿⢻⣹⣼⣶⣧⣯⣟⡿⢿⣻⣽⣾⣷⣿⣯⣏⡏⠏⠋⠉

[dialog]
    _default_ = color236;color252
    dfocus = color236;color109
    dhotnormal = color167;color252
    dhotfocus = color167;color109
    dselnormal = color236;color109
    dselfocus = color167;color109
    dtitle = color167;color252
    dframe = color236;color252

[error]
    _default_ = color188;color167
    errdfocus = color236;color252
    errdhotnormal = color222;color167
    errdhotfocus = color222;color252
    errdtitle = color222;color167
    errdframe = color188;color167

[menu]
    _default_ = color188;color24
    menusel = color188;color236
    menuhot = color222;color24
    menuhotsel = color222;color236
    menuinactive = color236;color24
    menuframe = color188;color24

[popupmenu]
    _default_ = color188;color24
    menusel = color222;color236
    menutitle = color222;color24
    menuframe = color188;color24

[buttonbar]
    hotkey = color188;color236
    button = color236;color109

[statusbar]
    _default_ = color236;color109

[help]
    _default_ = color236;color252
    helpitalic = color167;color252
    helpbold = color24;color252
    helplink = color236;color109
    helpslink = color222;color24
    helptitle = color24;color252
    helpframe = color236;color252

[editor]
    _default_ = color188;color236
    editbold = color222;color108
    editmarked = color236;color109
    editwhitespace = color24;color236
    editnonprintable = ;color236
    editlinestate = color188;color109
    bookmark = color188;color167
    bookmarkfound = color236;color108
    editrightmargin = color24;color236
    editframeactive = color188;
    editframedrag = color108;

[mcterm]
    _default_ = color188;color236
    mctermselected = color236;color188

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    breakpoint-char = ●
    breakpoint-pending-char = ◊
    breakpoint-disabled-char = ○
    breakpoint-condition-char = ◉
    exec-char = >
    exec-breakpoint-char = ♦
    tree-closed-char = >
    tree-open-char = ▼

[git-graph]
    commit = ●
    merge = ○
    ahead = ↑
    behind = ↓

[syntax]
    # the colors of the kinds of text the highlighting names (see the [syntax]
    # section of skins/README.txt); what is not named keeps the colors of mcedit
    comment = color60
    keyword.other.todo = color236;color179
    string = color144
    constant = color139
    constant.language = color110
    constant.character.escape = color179
    constant.other.placeholder = color179
    keyword = color110
    keyword.operator = color110
    storage = color110
    storage.type = color110
    support = color116
    support.type = color110
    support.type.property.name = color109
    entity.name = color116
    entity.name.tag = color110
    entity.name.section = color116
    entity.other.attribute.name = color109
    variable = color188
    variable.language = color110
    punctuation = color146
    meta.preprocessor = color110
    markup.heading = color116;;bold
    markup.bold = color188;;bold
    markup.italic = color188;;italic
    markup.underline.link = color116;;underline
    markup.list = color110
    markup.raw = color144
    markup.quote = color60;;italic
    markup.inserted = color144
    markup.deleted = color131
    markup.changed = color179
    meta.diff.header = color110;;bold
    meta.diff.range = color116
    invalid = color188;color131
