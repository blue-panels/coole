[skin]
    description = Gray-Orange-Blue Skin
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    bgmain = gray22
    bgbitdarker = gray21
    bgdarker = gray20
    main1 = rgb530
    main2 = rgb004

[core]
    _default_ = rgb000;bgmain
    gauge = ;main1
    input =
    inputunchanged = gray
    inputmark = ;main1
    disabled = gray8;bgdarker
    reverse =
    shadow = rgb000;gray12
    frame = rgb000;bgmain
    spinner_sequence = ⠈⠐⠠⢀⡀⠄⠂⠁⠉⠘⠰⢠⣀⡄⠆⠃⠋⠙⠸⢰⣠⣄⡆⠇⠏⠛⠹⢸⣰⣤⣆⡇⡏⠟⠻⢹⣸⣴⣦⣇⣏⡟⠿⢻⣹⣼⣶⣧⣯⣟⡿⢿⣻⣽⣾⣷⣿⣯⣏⡏⠏⠋⠉

[dialog]
    _default_ = rgb000;bgdarker
    dfocus = ;main1
    dhotnormal = main2
    dhotfocus = main2;main1
    dselnormal = ;main1
    dselfocus = main2;main1
    dtitle = main2
    dframe = rgb000;bgdarker

[error]
    _default_ = rgb555;rgb400;bold
    errdfocus = ;main2
    errdhotnormal = main1
    errdhotfocus = main1;main2
    errdtitle = main1
    errdframe = rgb555;rgb400;bold

[menu]
    _default_ = rgb000;bgdarker
    menusel = ;main1
    menuhot = main2
    menuhotsel = main2;main1
    menuinactive =
    menuframe = rgb000;bgdarker

[popupmenu]
    _default_ = rgb000;bgdarker
    menusel = ;main1
    menutitle = main2
    menuframe = rgb000;bgdarker

[buttonbar]
    hotkey = rgb000;bgmain
    button = rgb000;bgdarker

[statusbar]
    _default_ = rgb000;bgdarker

[help]
    _default_ = rgb000;bgdarker
    helpitalic = rgb020
    helpbold = rgb300
    helplink = main2;;underline
    helpslink = bgdarker;main2
    helptitle = main2
    helpframe = rgb000;bgdarker

[editor]
    _default_ = rgb000;bgmain
    editbold = rgb400
    editmarked = ;main1
    editwhitespace = rgb400;bgdarker
    editnonprintable = red
    editlinestate = ;bgdarker
    bookmark = ;main1
    bookmarkfound = lightgray;main2
    editrightmargin = rgb400;bgdarker
#    editbg =
    editframe = main2;
    editframeactive = rgb000;
    editframedrag = rgb400;

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    fold-open-char = ▾
    fold-close-char = ▸
