[skin]
    description = GoTaR @PLD Linux

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = lightgray;black
    gauge = ;brown
    input = brightgreen;
    disabled = gray;blue
    reverse = brightgreen;blue
    inputhistory =
    shadow = gray;black
    frame = lightgray;black

[dialog]
    _default_ = brightcyan;blue
    dfocus = brightred;black
    dhotnormal = brightred;
    dhotfocus = yellow;black
    dselnormal = brightred;black
    dselfocus = yellow;black
    dtitle = brightred;
    dframe = brightcyan;blue

[error]
    _default_ = white;red
    errdfocus = brightgreen;blue
    errdhotnormal = yellow;
    errdhotfocus = yellow;blue
    errdtitle = yellow;
    errdframe = white;red

[menu]
    _default_ = brightgreen;black
    menusel = brightcyan;blue
    menuhot = brightred;
    menuhotsel = yellow;
    menuinactive = lightgray;
    menuframe = brightgreen;black

[popupmenu]
    _default_ = brightgreen;black
    menusel = brightcyan;blue
    menutitle = brightcyan;black
    menuframe = brightgreen;black

[buttonbar]
    hotkey = lightgray;black
    button = white;blue

[statusbar]
    _default_ = white;blue

[help]
    _default_ = brightred;black
    helpitalic = brightcyan;
    helpbold = brightgreen;
    helplink = white;
    helpslink = yellow;blue
    helptitle = brightgreen;
    helpframe = brightred;black

[editor]
    _default_ = lightgray;black
    editbold = yellow;blue
    editmarked = brightgreen;red
    editwhitespace = brightblue;blue
    editnonprintable = ;black
    editlinestate = brightgreen
    bookmark = white;red
    bookmarkfound = black;green
    editrightmargin = brightblue;blue
#    editbg =
#    editframe =
    editframeactive = white;
    editframedrag = green;

[mcterm]
    _default_ = lightgray;black
    mctermselected = black;lightgray

[widget-editor]
    window-state-char = *
    window-close-char = X
    fold-open-char = v
    fold-close-char = >

[git-graph]
    ahead = ↑
    behind = ↓
