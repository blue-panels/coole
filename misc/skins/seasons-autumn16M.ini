# The Four Seasons skins demonstrate how to use direct RGB true colors.

[skin]
    # Falling leaves, beautiful forests, Halloween pumpkins.
    # Also search for "Why are autumn leaves yellow in Europe, red in America?"
    description = Four Seasons – Autumn
    truecolors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    Main = #992005
    MainFg = #ffa
    MarkedFg = #ff5
    HeaderFg = MarkedFg
    Selected = #681400
    Dialog = #85a918
    DialogFocus = #69880c
    Input = #b5c400
    PaleFg = #555
    ShadowFg = #7f7f55
    ShadowBg = #4c1002
    Error = #840000
    ErrorFocus = #b00
    Top = #ff9909
    MenuActive = Bottom
    MenuSelected = Top
    Bottom = #ffc90c
    BottomNumber = Main
    BottomNumberFg = MainFg
    Help = Bottom
    HelpBoldFg = DialogFocus
    HelpItalicFg = Main
    HelpLinkFg = ErrorFocus
    EditorLineNumber = Dialog
    EditorWhitespace = #cd4800
    EditorRightMargin = EditorWhitespace
    EditorBookmark = Bottom
    EditorFindAll = Top
    EditorVoid = DialogFocus
    EditorFrameFg = MainFg
    EditorFrameActiveFg = MarkedFg
    EditorFrameDragFg = BottomNumberFg
    ViewerBoldFg = MarkedFg
    ViewerUnderlinedFg = Bottom
    ViewerSelected = EditorBookmark
    DiffAdd = Dialog
    DiffChangedLine = Selected
    DiffGap = ErrorFocus
    StructDimFg = #d7c053
    TreeKeyFg = #b2e8ff
    TreeValueFg = #84ea84
    StructJumpFg = #33aaef
    StructRemarkFg = #84ea84
    StructChangedFg = #c27bff
    StructBlock = Top
    StructDimFg = #d7c053
    TreeKeyFg = #b2e8ff
    TreeValueFg = #84ea84
    StructJumpFg = #33aaef
    StructRemarkFg = #84ea84
    StructChangedFg = #c27bff
    StructBlock = Top

[core]
    _default_ = MainFg;Main
    gauge = ;DialogFocus
    input = #000;Input
    inputunchanged = PaleFg;Input
    inputmark = #000;DialogFocus
    disabled = PaleFg;Dialog
    reverse = #000;Bottom
    shadow = ShadowFg;ShadowBg
    frame = MainFg;Main
    spinner_sequence = ⠈⠐⠠⢀⡀⠄⠂⠁⠉⠘⠰⢠⣀⡄⠆⠃⠋⠙⠸⢰⣠⣄⡆⠇⠏⠛⠹⢸⣰⣤⣆⡇⡏⠟⠻⢹⣸⣴⣦⣇⣏⡟⠿⢻⣹⣼⣶⣧⣯⣟⡿⢿⣻⣽⣾⣷⣿⣯⣏⡏⠏⠋⠉

[dialog]
    _default_ = #000;Dialog
    dfocus = ;DialogFocus
    dhotnormal = ;;underline
    dhotfocus = ;DialogFocus;underline
    dselnormal = ;DialogFocus
    dselfocus = ;DialogFocus
    dtitle = ;;bold
    dframe = #000;Dialog

[error]
    _default_ = #fff;Error
    errdfocus = ;ErrorFocus
    errdhotnormal = ;;underline
    errdhotfocus = ;ErrorFocus;underline
    errdtitle = ;;bold
    errdframe = #fff;Error

[menu]
    _default_ = #000;MenuActive
    menusel = ;MenuSelected
    menuhot = ;;underline
    menuhotsel = ;MenuSelected;underline
    menuinactive = ;Top
    menuframe = #000;MenuActive

[popupmenu]
    _default_ = #000;Dialog
    menusel = ;DialogFocus
    menutitle = ;;bold
    menuframe = #000;Dialog

[buttonbar]
    hotkey = BottomNumberFg;BottomNumber
    button = #000;Bottom

[statusbar]
    _default_ = #000;Top

[help]
    _default_ = #000;Help
    helpbold = HelpBoldFg;;bold
    helpitalic = HelpItalicFg;;italic
    helplink = HelpLinkFg;;underline
    helpslink = Help;HelpLinkFg
    helpframe = #000;Help

[editor]
    _default_ = MainFg;Main
    editbold = MarkedFg;;bold
    editmarked = ;Selected
    editwhitespace = ;EditorWhitespace
    editnonprintable = #000;Bottom
    editlinestate = #000;EditorLineNumber
    bookmark = #000;EditorBookmark
    bookmarkfound = #000;EditorFindAll
    editrightmargin = ;EditorRightMargin
    editbg = ;EditorVoid
    editframe = EditorFrameFg
    editframeactive = EditorFrameActiveFg
    editframedrag = EditorFrameDragFg

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    fold-open-char = ▾
    fold-close-char = ▸
