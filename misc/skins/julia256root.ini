# Dark skin with calm colors and good contrast. Mix of the standard & xoria256 skins.

[skin]
    description = Dark skin with calm colors and good contrast (root)
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = lightgray;color237
    gauge = white;color237
    input = black;cyan
    inputunchanged = gray;cyan
    inputmark = cyan;color94
    disabled = gray;lightgray
    reverse = black;lightgray
    inputhistory =
    shadow = gray;black
    frame = lightgray;color237

[dialog]
    _default_ = black;lightgray
    dfocus = black;cyan
    dhotnormal = red;
    dhotfocus = red;cyan
    dselnormal = black;cyan
    dselfocus = red;cyan
    dtitle = black;
    dframe = black;lightgray

[error]
    _default_ = white;red
    errdfocus = black;lightgray
    errdhotnormal = yellow;red
    errdhotfocus = red;lightgray
    errdtitle = yellow;red
    errdframe = white;red

[menu]
    _default_ = lightgray;blue
    menusel = black;cyan
    menuhot = white;blue
    menuhotsel = white;cyan
    menuinactive = black;lightgray
    menuframe = lightgray;blue

[popupmenu]
    _default_ = lightgray;blue
    menusel = black;cyan
    menutitle = yellow;blue
    menuframe = lightgray;blue

[buttonbar]
    hotkey = red;lightgray
    button = black;lightgray

[statusbar]
    _default_ = black;lightgray

[help]
    _default_ = black;lightgray
    helpitalic = red;lightgray
    helpbold = blue;lightgray
    helplink = black;cyan
    helpslink = yellow;blue
    helptitle = blue;lightgray
    helpframe = black;lightgray

[editor]
    _default_ = lightgray;black
    editbold = yellow;green
    editmarked = black;lightgray
    editwhitespace = brightblue;black
    editnonprintable = ;black
    editlinestate = white;cyan
    bookmark = white;red
    bookmarkfound = black;green
    editrightmargin = lightgray;color237
#    editbg =
    editframe = gray;
    editframeactive = lightgray;
    editframedrag = red;
    window-state-char = ↕
    window-close-char = ✕

[mcterm]
    _default_ = lightgray;black
    mctermselected = black;lightgray

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    fold-open-char = ▾
    fold-close-char = ▸
