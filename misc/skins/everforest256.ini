# Everforest theme for coole
# Based on the Everforest color scheme: https://github.com/sainnhe/everforest
# A green based color scheme designed to be warm and soft

[skin]
    description = Everforest - Green based warm and soft color scheme
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = color188;color235
    gauge = color188;color237
    input = color235;color108
    inputunchanged = lightgray;color108
    inputmark = color108;color235
    disabled = color245;color248
    reverse = color235;color188
    hintbar = default;default
    shellprompt = default;default
    commandline = default;default
    inputhistory =
    shadow = color245;color16
    frame = color188;color235
    spinner_sequence = ▲◀▼▶

[dialog]
    _default_ = color235;color248
    dfocus = color235;color108
    dhotnormal = color167;color248
    dhotfocus = color167;color108
    dselnormal = color235;color108
    dselfocus = color167;color108
    dtitle = color167;color248
    dframe = color235;color248

[error]
    _default_ = color188;color167
    errdfocus = color235;color248
    errdhotnormal = color179;color167
    errdhotfocus = yellow;color248
    errdtitle = color179;color167
    errdframe = color188;color167

[menu]
    _default_ = color188;color28
    menusel = color188;color235
    menuhot = color179;color28
    menuhotsel = color179;color235
    menuinactive = color235;color28
    menuframe = color188;color28

[popupmenu]
    _default_ = color188;color28
    menusel = color179;color235
    menutitle = color179;color28
    menuframe = color188;color28

[buttonbar]
    hotkey = color188;color235
    button = color235;color108

[statusbar]
    _default_ = color235;color108

[help]
    _default_ = color235;color248
    helpitalic = color167;color248
    helpbold = color28;color248
    helplink = color235;color108
    helpslink = color179;color28
    helptitle = color28;color248
    helpframe = color235;color248

[editor]
    _default_ = color188;color235
    editbold = color179;color142
    editmarked = color235;color108
    editwhitespace = color28;color235
    editnonprintable = color28;color235
    editlinestate = color188;color108
    bookmark = color188;color167
    bookmarkfound = color235;color142
    editrightmargin = color28;color235
    editframeactive = color188;
    editframedrag = color142;

[mcterm]
    _default_ = color188;color235
    mctermselected = ;;reverse

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[git-graph]
    commit = ●
    merge = ○
    ahead = ↑
    behind = ↓

[syntax]
    # the colors of the kinds of text the highlighting names (see the [syntax]
    # section of skins/README.txt); what is not named keeps the colors of mcedit
    comment = color102
    keyword.other.todo = color235;color180
    string = color144
    constant = color175
    constant.language = color175
    constant.character.escape = color180
    constant.other.placeholder = color180
    keyword = color174
    keyword.operator = color180
    storage = color174
    storage.type = color180
    support = color144
    support.type = color180
    support.type.property.name = color180
    entity.name = color144
    entity.name.tag = color174
    entity.name.section = color109
    entity.other.attribute.name = color180
    variable = color187
    variable.language = color175
    punctuation = color102
    meta.preprocessor = color175
    markup.heading = color109;;bold
    markup.bold = color187;;bold
    markup.italic = color187;;italic
    markup.underline.link = color144;;underline
    markup.list = color174
    markup.raw = color144
    markup.quote = color102;;italic
    markup.inserted = color144
    markup.deleted = color174
    markup.changed = color180
    meta.diff.header = color174;;bold
    meta.diff.range = color144
    invalid = color187;color167
