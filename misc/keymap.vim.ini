[editor]
# No remapping, just use vim instead of mcedit

[mcterm]
# Every key not named here is typed into the shell. The cursor keys, Home and
# End are the shell's: its own line editor and history take them. The shifted
# cursor keys mark the output from where the shell is typing.
Store = ctrl-insert; enter; f2
MarkAll = f3
Unmark = ctrl-shift-u
MarkLeft = shift-left
MarkRight = shift-right
MarkUp = shift-up
MarkDown = shift-down
MarkPageUp = shift-pgup
MarkPageDown = shift-pgdn
MarkToHome = shift-home
MarkToEnd = shift-end
ScrollUp = ctrl-up
ScrollDown = ctrl-down
PageUp = pgup
PageDown = pgdn
Top = ctrl-home
Bottom = ctrl-end
Clear = ctrl-l
# The screen and the scrollback both, where Clear keeps the scrollback.
ClearAll = ctrl-shift-l; ctrl-alt-l; f6
# The output cut down to the rows that match the mark, or the word under the cursor.
FilterWord = f4
FilterToggle = f5
# A pattern typed on the top row: the output searched
# for it, or cut down to the rows that match it.
Search = alt-s
QuickFilter = alt-shift-s
