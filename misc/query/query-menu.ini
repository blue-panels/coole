# The menu of a file of queries: F11 in bluerig -Q.  A group for each item, its name the key of
# the item; the items in this order.  ~/.config/bluerig/query/query-menu.ini takes its place.
#
#   label   = what the menu shows (an action has one of its own)
#   action  = explain, count, table, limit, upper, lower, menu
#   command = run by sh in the directory of the file instead: the query on its stdin (the
#             selection, else the part between the lines "// ---" around the cursor, else the
#             file), BLUERIG_QUERY_KIND (postgres, mongo) in its environment
#   output  = what is done with what the command prints: insert (at the cursor, the default),
#             replace (the query), show (in Output), none
#   kinds   = postgres;mongo: the databases it is in the menu for, all without it
#
# [f]
# label = Format the query by pg_format
# command = pg_format -
# output = replace
# kinds = postgres

[e]
action = explain

[c]
action = count
kinds = postgres

[t]
action = table
kinds = mongo

[l]
action = limit
kinds = mongo

[U]
action = upper

[L]
action = lower

[m]
action = menu
